name: Portal checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Studio · ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { profile: desktop, engine: chromium }
          - { profile: mobile, engine: chromium }
          - { profile: ipad-webkit, engine: webkit }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.profile == 'desktop'
        run: npm run lint && npm test
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:e2e -- --project=${{ matrix.profile }} --workers=2 --reporter=line
